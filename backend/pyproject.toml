[project]
name = "chess-backend"
version = "0.1.0"
description = "Python API for the chess web app"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "email-validator>=2.2,<3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
